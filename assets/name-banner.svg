<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Fundo do card (mantido) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="55%" stop-color="#0f1a33"/>
      <stop offset="100%" stop-color="#0a0f1f"/>
    </linearGradient>

    <!-- Preenchimento suave (branco -> azul-claro), monocromático -->
    <linearGradient id="softFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BCD0EA"/>
    </linearGradient>

    <!-- Reflexo de luz que desliza pelo nome -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="5.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Máscara com o formato do nome (para o reflexo passar só pelas letras) -->
    <clipPath id="nameClip">
      <text x="450" y="120" text-anchor="middle" font-size="64" font-weight="800" letter-spacing="1">Andredye Oliveira</text>
    </clipPath>

    <!-- Glow suave p/ legibilidade -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card -->
  <rect x="0" y="0" width="900" height="240" rx="20" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="900" height="240" rx="20" fill="url(#halo)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="898" height="238" rx="19" fill="none" stroke="#1e2a44" stroke-width="1"/>

  <!-- Partículas piscando -->
  <g fill="#22d3ee">
    <circle cx="120" cy="60" r="2.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="70" r="2"><animate attributeName="opacity" values="1;0.15;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="190" r="1.8" fill="#a855f7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="195" r="2.2" fill="#a855f7"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="130" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="150" r="1.6" fill="#3b82f6"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="48" r="1.4" fill="#a855f7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="200" r="1.4"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Nome: preenchimento suave -->
  <text x="450" y="120" text-anchor="middle" font-size="64" font-weight="800" letter-spacing="1" fill="url(#softFill)" filter="url(#glow)">Andredye Oliveira</text>

  <!-- Reflexo de luz deslizando sobre as letras -->
  <g clip-path="url(#nameClip)">
    <rect x="0" y="60" width="900" height="80" fill="url(#shine)"/>
  </g>

  <!-- Linha que se desenha (tom suave) -->
  <line x1="340" y1="142" x2="560" y2="142" stroke="#B9CCE6" stroke-width="3" stroke-linecap="round" stroke-dasharray="220" stroke-dashoffset="220">
    <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1.1s" fill="freeze"/>
  </line>

  <!-- Subtítulo -->
  <text x="450" y="178" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="3" fill="#c7d4e8">DESENVOLVEDOR GO  ·  TASKER  ·  BACKEND</text>
</svg>
